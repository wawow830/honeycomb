 {id:'INV-042',client:'Common Ground',amount:2400,status:'Sent',date:'Sep 20'},
 {id:'INV-043',client:'Forma',amount:6250,status:'Paid',date:'Sep 20'},
 {id:'INV-044',client:'Northstar',amount:1800,status:'Overdue',date:'Sep 12'},
 {id:'INV-045',client:'Fieldwork',amount:3600,status:'Sent',date:'Sep 22'},
 {id:'INV-046',client:'Studio Ordinary',amount:950,status:'Paid',date:'Sep 22'}
];
const money=n=>'$'+n.toLocaleString('en-US');
function initialState(){return {page:'workspace',tab:'preview',branch:'export-stream',file:'src/export.ts',filter:'All',search:'',scope:null,reviewed:false,checkStatus:'idle',selected:'export',railOpen:false,result:null,drafts:{},sessions:[{id:'export',title:'Export timeouts',kind:'Change',status:'Needs decision',agent:'Agent 01',messages:[]},{id:'recurring',title:'Recurring invoices',kind:'Discovery',status:'Findings ready',agent:'Agent 02',messages:[]},{id:'rounding',title:'Rounding discrepancies',kind:'Investigation',status:'Reproduced',agent:'Agent 03',messages:[]}]}}
let state=initialState(),checkTimer,toastTimer;
function session(){return state.sessions.find(s=>s.id===state.selected)}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function activeRows(){return invoices.filter(x=>(state.filter==='All'||(state.filter==='Unpaid'?x.status!=='Paid':x.status==='Paid'))&&(x.client+' '+x.id).toLowerCase().includes(state.search.toLowerCase()))}
function render(){
 const focused=document.activeElement;
 const focusId=focused?.id;
 const selection=focused instanceof HTMLTextAreaElement ? [focused.selectionStart,focused.selectionEnd] : null;
 document.querySelectorAll('[data-action="page"]').forEach(b=>{if(b.dataset.value===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('page-name').textContent={workspace:'Workspace',work:'Work',decisions:'Decisions'}[state.page];
 $('work-count').textContent=state.sessions.length;$('decision-count').textContent=state.scope?2:1;
 $('body').classList.toggle('rail-open',state.railOpen);document.querySelector('[data-action="toggle-rail"]').setAttribute('aria-expanded',String(state.railOpen));
 $('footer-state').textContent=state.branch==='main'?'main · no local changes':'export-stream · 2 changed files';
 renderMain();renderRail();injectIcons();
 document.querySelectorAll('.code-pane').forEach(el=>{el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label','Sample code')});
 syncRail();
 if(focusId&&$(focusId)){ $(focusId).focus({preventScroll:true}); if(selection)$(focusId).setSelectionRange(...selection); }
}
function renderMain(){
 if(state.page==='work'){$('main').innerHTML=workPage();return}
 if(state.page==='decisions'){$('main').innerHTML=decisionsPage();return}
 const tabs=[['preview','Preview'],['source','Source'],['changes','Changes'],['checks','Checks']];
 if(state.tab==='notes')tabs.push(['notes','Notes']);
 $('main').innerHTML=`<div class="workbar"><h1>Workspace</h1><label class="branch-select">${icon('branch')}<select id="branch" aria-label="Preview branch"><option value="main" ${state.branch==='main'?'selected':''}>main</option><option value="export-stream" ${state.branch==='export-stream'?'selected':''}>export-stream</option></select></label></div><nav class="tabs" aria-label="Workspace panels">${tabs.map(([id,name])=>`<button data-action="tab" data-value="${id}" aria-pressed="${state.tab===id}">${name}${id==='changes'&&state.branch!=='main'?' <span class="tab-count">2</span>':''}</button>`).join('')}</nav>${state.tab==='preview'?preview():state.tab==='source'?sourceView():state.tab==='changes'?changesView():state.tab==='checks'?checksView():noteView()}`;
 if(state.tab==='preview')renderRows();
}
function preview(){return `<div class="canvas"><div class="preview-window"><div class="preview-chrome"><span class="chrome-dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="url">ledger.local / invoices</span><span>${esc(state.branch)}</span></div><section class="product" aria-label="Ledger app preview"><div class="product-top"><div class="product-logo">ledger<em>.</em></div><div class="row"><span class="small" style="color:#616b54">North Studio</span><span class="avatar">NS</span></div></div><div class="product-body"><div class="product-heading"><div><h2>Invoices</h2><p class="product-sub">September · North Studio</p></div><button class="btn" data-action="export">${icon('export')}Export</button></div><div class="metrics"><div class="metric"><span class="caption">Outstanding</span><strong>$7,800</strong></div><div class="metric"><span class="caption">Paid this month</span><strong>$12,000</strong></div><div class="metric"><span class="caption">Overdue</span><strong class="overdue">$1,800</strong></div></div><div class="filters" role="group" aria-label="Invoice filters">${['All','Unpaid','Paid'].map(f=>`<button data-action="filter" data-value="${f}" aria-pressed="${state.filter===f}">${f}</button>`).join('')}<input class="filter-search" id="invoice-search" aria-label="Search invoices" placeholder="Find invoice…" value="${esc(state.search)}"></div><div class="table-wrap"><table><thead><tr><th class="table-id">Invoice</th><th>Client</th><th>Status</th><th class="table-date">Issued</th><th>Amount</th></tr></thead><tbody id="invoice-rows"></tbody></table></div><div class="product-footer" id="invoice-count"></div><div id="export-result" role="status" ${state.result?'':'hidden'} class="export-result ${state.result?.error?'error':''}">${state.result?esc(state.result.text):''}</div></div></section></div><div class="preview-note">${icon('branch')}<span>${state.branch==='main'?'Main branch · export timeout reproduced in the sample session.':'Isolated preview · changes have not been merged.'}</span></div></div>`}
function renderRows(){const rows=activeRows();$('invoice-rows').innerHTML=rows.length?rows.map(x=>`<tr><td class="table-id invoice-id">${x.id}</td><td>${x.client}</td><td><span class="status-pill ${x.status}">${x.status}</span></td><td class="table-date" style="color:#626d56">${x.date}</td><td>${money(x.amount)}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;color:#626d56">No invoices found</td></tr>';$('invoice-count').textContent=rows.length+' invoices'}
function exportPreview(){
 if(state.branch==='main')state.result={error:true,text:'Sample failure · export exceeded the 30-second timeout.'};
 else if(!state.scope){state.result={error:true,text:'Export scope is unresolved. Choose it in the session.'};state.railOpen=true;state.selected='export'}
 else {const count=state.scope==='all'?invoices.length:activeRows().length;state.result={error:false,text:`Sample export · ${count} invoice${count===1?'':'s'} · ${state.scope==='all'?'all invoices':'current filters'}`};}
 render();
}
function highlight(line){let clean=esc(line);if(line.trim().startsWith('//'))return '<span class="code-comment">'+clean+'</span>';return clean.replace(/\b(export|async|function|const|await|for|return|import|from|expect|test)\b/g,'<span class="code-keyword">$1</span>')}
function codeLines(lines,mode=false){return lines.map((line,i)=>`<div class="code-line ${mode&&line.startsWith('+')?'add':mode&&line.startsWith('-')?'remove':''}"><span class="line-no">${mode?'':i+1}</span><span>${highlight(line)}</span></div>`).join('')}
function exportSource(){if(state.branch==='main')return ['import { db, csv } from "./services";','','export async function exportInvoices(filters, reply) {','  const invoices = await db.invoices.findMany(filters);','  const file = csv.serialize(invoices);','','  return reply.send(file);','}'];return ['import { db, csv } from "./services";','','export async function exportInvoices(filters, reply) {',state.scope?`  const query = ${state.scope==='all'?'{}':'filters'};`:'  // Export scope: awaiting a product decision.','  const rows = db.invoices.cursor('+(!state.scope?'/* scope */':'query')+');','','  reply.type("text/csv");','  reply.write(csv.header());','','  for await (const invoice of rows) {','    if (reply.closed) return;','    reply.write(csv.row(invoice));','  }','','  reply.end();','}']}
function fileSource(){if(state.file==='src/export.ts')return exportSource();if(state.file==='src/invoices.ts')return ['import { db } from "./services";','','export async function listInvoices(filters) {','  return db.invoices.findMany({','    ...filters,','    orderBy: { issuedAt: "desc" },','  });','}'];return ['import { test, expect } from "vitest";','import { runExport } from "./fixtures";','','test("writes every row exactly once", async () => {','  const result = await runExport({ rows: 250_000 });','  expect(result.rowCount).toBe(250_000);','  expect(result.uniqueIds).toBe(250_000);','});','','test("stops on disconnect", async () => {','  const result = await runExport({ disconnectAfter: 50 });','  expect(result.cursorClosed).toBe(true);','});','','// Filter-scope assertion follows the product decision.']}
function sourceView(){const files=state.branch==='main'?['src/export.ts','src/invoices.ts']:['src/export.ts','src/invoices.ts','tests/export.test.ts'];if(!files.includes(state.file))state.file=files[0];return `<div class="code-layout"><nav class="file-list" aria-label="Source files"><div class="label">Files</div>${files.map(f=>`<button data-action="file" data-value="${f}" aria-pressed="${f===state.file}">${f}</button>`).join('')}</nav><div class="code-pane"><div class="code-head">${state.file} <span class="badge">sample</span></div>${codeLines(fileSource())}</div></div>`}
function changesView(){if(state.branch==='main')return '<div class="empty">No local changes on main.</div>';const lines=[' export async function exportInvoices(filters, reply) {','-  const invoices = await db.invoices.findMany(filters);','-  const file = csv.serialize(invoices);','-  return reply.send(file);',state.scope?`+  const query = ${state.scope==='all'?'{}':'filters'};`:'+  // Export scope: awaiting a product decision.','+  const rows = db.invoices.cursor('+(!state.scope?'/* scope */':'query')+');','+  reply.type("text/csv");','+  reply.write(csv.header());','+  for await (const invoice of rows) {','+    if (reply.closed) return;','+    reply.write(csv.row(invoice));','+  }','+  reply.end();',' }'];return `<div class="diff-summary"><div><h2>Stream invoice exports</h2><div class="small">2 files · against main · sample patch</div></div><button class="btn ${state.reviewed?'selected':''}" data-action="review" ${!state.scope||state.checkStatus!=='done'?'disabled':''}>${icon('check')}${state.reviewed?'Reviewed':'Mark reviewed'}</button></div><div class="code-pane"><div class="code-head">src/export.ts</div>${codeLines(lines,true)}<div class="code-head" style="margin-top:28px">tests/export.test.ts</div>${codeLines(fileTestDiff(),true)}</div><div class="diff-summary small muted">${state.reviewed?'Review recorded in this mockup. Nothing merged.':!state.scope?'Export scope needs a decision.':state.checkStatus!=='done'?'Run the sample checks before marking reviewed.':'Ready for review. No merge action in this mockup.'}</div>`}
function fileTestDiff(){return ['+ test("writes every row exactly once", async () => {','+   const result = await runExport({ rows: 250_000 });','+   expect(result.rowCount).toBe(250_000);','+   expect(result.uniqueIds).toBe(250_000);','+ });','+', '+ test("stops on disconnect", async () => {','+   const result = await runExport({ disconnectAfter: 50 });','+   expect(result.cursorClosed).toBe(true);','+ });']}
function checksView(){if(state.branch==='main')return '<div class="empty">No check run selected on main.</div>';let labels=['Every row written once','Bounded memory','Cursor closes on disconnect','Export scope'];return `<section class="content-page"><div class="row between"><div><h2>Export checks</h2><p class="small muted" style="margin-top:5px">Sample run · 250,000 rows · seed 42</p></div><button class="btn" data-action="checks" ${state.checkStatus==='running'?'disabled':''}>${icon('play')}${state.checkStatus==='running'?'Running…':'Run sample'}</button></div><div class="check-list">${labels.map((label,i)=>{const blocked=i===3&&!state.scope;const done=state.checkStatus==='done'&&!blocked;return `<div class="check-row"><span><span class="check-icon ${done?'':'pending'}">${done?'✓':blocked?'?':'○'}</span>${label}</span><span class="check-result">${blocked?'Needs decision':done?'Pass':state.checkStatus==='running'?'Running':'Not run'}</span></div>`}).join('')}</div><details style="margin-top:22px"><summary class="small muted" style="cursor:pointer">Run context</summary><pre class="mono muted" style="white-space:pre-wrap;line-height:1.9;margin-top:14px">pnpm test:export --rows 250000 --seed 42
Node 22 · PostgreSQL 17
Artifacts: stdout.log, measurements.json
Not checked: production proxy, load, authorization</pre></details></section>`}
function noteView(){const research=state.selected==='recurring';return `<article class="content-page note-doc"><div class="label">${research?'Customer notes · sample':'Investigation · sample'}</div><h1 style="margin-top:10px">${research?'Recurring invoices':'Rounding discrepancies'}</h1>${research?'<blockquote>“I duplicate the same invoice on the first of every month.”</blockquote><p>Customer interview · North Studio · September 18</p><h2>Observed</h2><ul><li>Four customers reuse last month’s invoice.</li><li>Amounts often change before sending.</li><li>None asked for automatic sending.</li></ul><h2>Open question</h2><p>Would a scheduled draft remove enough work?</p>':'<blockquote>Three line items at $0.335 produce a one-cent mismatch.</blockquote><p>Reproduced in invoice INV-039. The preview rounds each line; the export rounds only the final total.</p><h2>Existing decision</h2><p>Round each line to the currency’s minor unit, then sum. No patch has been prepared.</p><button class="btn" data-action="page" data-value="decisions">Open decision</button>'}</article>`}
function workPage(){return `<section class="content-page"><div class="page-heading row between"><h1>Work</h1><button class="btn" data-action="new-work">${icon('plus')}New work</button></div><div class="work-list">${state.sessions.map(s=>`<button class="work-item" data-action="session" data-value="${s.id}"><span class="dot ${s.status==='Needs decision'?'amber':s.kind==='Draft'?'gray':''}"></span><div class="grow"><strong>${esc(s.title)}</strong><small>${esc(s.kind)} · ${esc(s.agent)}</small></div><span class="badge">${esc(s.status)}</span>${icon('chevron')}</button>`).join('')}</div></section>`}
function decisionsPage(){return `<section class="content-page"><div class="page-heading"><h1>Decisions</h1></div>${state.scope?`<article class="decision"><div class="label">D-08 · you · this session</div><h2>Export ${state.scope==='all'?'all invoices':'the current view'}</h2><p>${state.scope==='all'?'Exports ignore the table’s search and status filters.':'Exports respect the table’s search and status filters.'}</p><button class="link" data-action="session" data-value="export">Export timeouts →</button></article>`:''}<article class="decision"><div class="label">D-07 · sample record</div><h2>Round line items before summing</h2><p>Use the currency’s minor unit. The preview, PDF, and CSV must agree.</p><button class="link" data-action="session" data-value="rounding">Rounding discrepancies →</button></article></section>`}
function renderRail(){const s=session();$('rail').innerHTML=`<div class="rail-header row between"><h2>Sessions <span class="muted small">${state.sessions.length}</span></h2><div class="row"><button class="icon-btn" data-action="new-work" aria-label="New work">${icon('plus')}</button><button class="icon-btn mobile-work" data-action="toggle-rail" aria-label="Close sessions">${icon('close')}</button></div></div><div class="session-list">${state.sessions.map(x=>`<button class="session-btn" data-action="session" data-value="${x.id}" aria-pressed="${s.id===x.id}"><span class="dot ${x.status==='Needs decision'?'amber':x.kind==='Draft'?'gray':''}"></span><span><span class="session-title">${esc(x.title)}</span><span class="session-meta">${esc(x.agent)} · ${esc(x.status)}</span></span></button>`).join('')}</div><div class="session-detail"><h2>${esc(s.title)}</h2><p class="muted">${esc(s.kind)} · ${s.kind==='Draft'?'no runtime connected':'sample session'}</p>${sessionDetail(s)}${s.messages.map(m=>`<div class="user-message"><span class="label">You</span>${esc(m)}</div>`).join('')}</div><div class="composer-wrap"><form class="composer" id="direction-form"><textarea id="direction" aria-label="Session direction" placeholder="Add direction…" maxlength="2000">${esc(state.drafts[s.id]||'')}</textarea><div class="composer-bottom"><span class="small">${s.kind==='Draft'?'Draft session':esc(s.agent)}</span><button class="send" type="submit" aria-label="Add direction">${icon('arrow')}</button></div></form></div>`}
function event(text,action,value,label){return `<div class="event"><span class="event-mark"></span><div><p>${text}</p>${label?`<button class="link" data-action="${action}" data-value="${value}">${label}</button>`:''}</div></div>`}
function sessionDetail(s){if(s.id==='export')return `<div class="timeline">${event('Timeout reproduced at 250k rows.','tab','checks','export-fixture / seed 42')}${event('Replaced buffering with a cursor.','tab','changes','src/export.ts')}${event('Disconnect cleanup covered.','file','tests/export.test.ts','tests/export.test.ts')}</div><div class="question ${state.scope?'resolved':''}"><div class="label">${state.scope?'Decision recorded':'Your call'}</div><p>What should Export include?</p><div class="choices"><button class="btn ${state.scope==='view'?'selected':''}" data-action="scope" data-value="view">${state.scope==='view'?icon('check'):''}Current filters</button><button class="btn ${state.scope==='all'?'selected':''}" data-action="scope" data-value="all">${state.scope==='all'?icon('check'):''}All invoices</button></div></div><div class="session-actions"><button class="btn" data-action="tab" data-value="changes">Inspect changes</button><button class="btn" data-action="tab" data-value="preview">Open preview</button></div>`;if(s.id==='recurring')return `<div class="timeline">${event('Compared four customer interviews.','notes','','customer-notes / recurring')}${event('Repeated amounts are not always identical.')}</div><div class="question"><div class="label">Finding</div><p>Scheduled drafts may be enough. Automatic sending needs more evidence.</p></div><div class="session-actions"><button class="btn" data-action="notes">Read notes</button></div>`;if(s.id==='rounding')return `<div class="timeline">${event('Preview and export disagree by one cent.','notes','','INV-039 / reproducer')}${event('Export rounds after summing. The existing rule says to round each line.','page','decisions','D-07 / rounding')}</div><div class="session-actions"><button class="btn" data-action="notes">Inspect finding</button></div>`;return `<p class="muted small" style="margin-top:20px">${s.context?esc(s.context):'No context added.'}</p>`}
function selectSession(id){state.selected=id;state.page='workspace';state.railOpen=true;if(id==='export'){state.branch='export-stream';state.tab='preview'}else if(id==='recurring'||id==='rounding')state.tab='notes';else state.page='work';render()}
function openTab(tab){state.page='workspace';state.tab=tab;state.railOpen=false;render()}
function setScope(value){if(state.scope===value)return;state.scope=value;state.checkStatus='idle';state.reviewed=false;state.result=null;clearTimeout(checkTimer);state.sessions.find(s=>s.id==='export').status='Checks pending';state.branch='export-stream';render();toast('Decision recorded · sample checks need rerunning')}
function runChecks(){clearTimeout(checkTimer);state.checkStatus='running';render();checkTimer=setTimeout(()=>{state.checkStatus='done';state.sessions.find(s=>s.id==='export').status=state.scope?'Ready for review':'Needs decision';render();toast(state.scope?'Sample checks passed':'Three sample checks passed · export scope unresolved')},800)}
function reset(){clearTimeout(checkTimer);clearTimeout(toastTimer);state=initialState();$('toast').hidden=true;render();toast('Mockup reset')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const v=b.dataset.value;switch(b.dataset.action){case 'page':state.page=v;state.railOpen=false;render();break;case 'tab':if(b.closest('#rail')){state.branch='export-stream';state.selected='export'}openTab(v);break;case 'file':if(b.closest('#rail')){state.branch='export-stream';state.selected='export'}state.file=v;openTab('source');break;case 'filter':state.filter=v;state.result=null;renderMain();break;case 'export':exportPreview();break;case 'session':selectSession(v);break;case 'scope':setScope(v);break;case 'checks':runChecks();break;case 'review':if(state.scope&&state.checkStatus==='done'){state.reviewed=!state.reviewed;state.sessions.find(s=>s.id==='export').status=state.reviewed?'Reviewed':'Ready for review';render();toast(state.reviewed?'Review recorded · nothing merged':'Review cleared')}break;case 'notes':state.page='workspace';state.tab='notes';state.railOpen=false;render();break;case 'toggle-rail':state.railOpen=!state.railOpen;render();if(compact.matches)document.querySelector(state.railOpen?'#rail [data-action="toggle-rail"]':'.topbar [data-action="toggle-rail"]').focus();break;case 'new-work':$('new-dialog').showModal();$('new-name').focus();break;case 'close-dialog':$('new-dialog').close();break;case 'reset':reset();break}});
document.addEventListener('change',e=>{if(e.target.id==='branch'){state.branch=e.target.value;state.result=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='invoice-search'){state.search=e.target.value;state.result=null;renderRows();$('export-result').hidden=true}if(e.target.id==='direction')state.drafts[state.selected]=e.target.value});
document.addEventListener('submit',e=>{if(e.target.id==='direction-form'){e.preventDefault();const text=$('direction').value.trim();if(!text){$('direction').focus();return}session().messages.push(text);state.drafts[state.selected]='';renderRail();$('direction').focus();toast('Added to mock session · no agent connected')}if(e.target.id==='new-form'){e.preventDefault();const title=$('new-name').value.trim();if(!title){$('new-name').setCustomValidity('Enter a title.');$('new-name').reportValidity();return}const id='draft-'+Date.now();state.sessions.push({id,title,context:$('new-context').value.trim(),kind:'Draft',status:'Draft',agent:'Unassigned',messages:[]});$('new-dialog').close();$('new-form').reset();selectSession(id);$('direction').focus()}});
$('new-name').addEventListener('input',()=> $('new-name').setCustomValidity(''));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('new-dialog').open&&state.railOpen){state.railOpen=false;render()}if(e.target.id==='direction'&&(e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();$('direction-form').requestSubmit()}});
const compact=matchMedia('(max-width:950px)');
function syncRail(){$('main').inert=compact.matches&&state.railOpen}
compact.addEventListener('change',syncRail);
injectIcons();render();
</script>
</body>
</html>
